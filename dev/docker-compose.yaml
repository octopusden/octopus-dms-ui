version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: artifactory-postgres
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.125.7
    container_name: artifactory
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18081:8081"
      - "18082:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    environment:
      - JF_SHARED_DATABASE_TYPE=postgresql
      - JF_SHARED_DATABASE_DRIVER=org.postgresql.Driver
      - JF_SHARED_DATABASE_URL=jdbc:postgresql://postgres:5432/artifactory
      - JF_SHARED_DATABASE_USERNAME=artifactory
      - JF_SHARED_DATABASE_PASSWORD=secret
    restart: unless-stopped

  components-registry-service:
    container_name: dms-dev-components-registry-service
    image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/components-registry-service:${OCTOPUS_COMPONENTS_REGISTRY_SERVICE_VERSION}
    ports:
      - "4567:4567"
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_CONFIG_ENABLED=false
    volumes:
      - ./configs/components-registry-service.yaml:/application-dev.yaml
      - ./test-data/components-registry:/components-registry

  release-management-service:
    container_name: dms-dev-release-management-service
    image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/release-management-service:${OCTOPUS_RELEASE_MANAGEMENT_SERVICE_VERSION}
    ports:
      - "8083:8083"
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_CONFIG_ENABLED=false
    volumes:
      - ./configs/release-management-service.yaml:/application-dev.yaml

  mockserver:
    container_name: dms-dev-mockserver
    image: ${DOCKER_REGISTRY}/mockserver/mockserver:mockserver-5.11.1
    ports:
      - "1080:1080"

  dms-db:
    image: ${DOCKER_REGISTRY}/postgres:11-alpine
    container_name: dms-dev-dms-db
    restart: always
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
      POSTGRES_DB: dms
    ports:
      - 5432:5432

  dms-service:
    container_name: dms-dev-dms-service
    image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/dms-service:${OCTOPUS_DMS_SERVICE_VERSION}
    ports:
      - "8080:8080"
    volumes:
      - ./configs/dms-service.yaml:/application-dev.yaml
    depends_on:
      - dms-db
      - artifactory
      - components-registry-service
      - mockserver
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - AUTH_SERVER_URL=${AUTH_SERVER_URL}
      - AUTH_SERVER_REALM=${AUTH_SERVER_REALM}
volumes:
  postgres-data:
  artifactory-data: